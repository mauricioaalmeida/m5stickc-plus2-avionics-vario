[platformio]
default_envs = m5stickc_plus2

; ==============================================================================
; M5StickC Plus2 Aviation Avionics (Artificial Horizon + Altimeter / Variometer)
; ==============================================================================
[env:m5stickc_plus2]
platform = espressif32
framework = arduino
board = m5stick-c
board_build.partitions = default_8MB.csv
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
board_build.flash_mode = dio
board_build.f_flash = 40000000L
board_build.f_cpu = 240000000L

upload_speed = 1500000
monitor_speed = 115200
upload_port = COM8
monitor_port = COM8

build_flags =
	-DM5STICKC_PLUS2
	-DARDUINO_M5Stick_C_Plus2
	-DBARO_ONLY_MODE
	-DCORE_DEBUG_LEVEL=1

build_src_filter =
	+<m5_avionics_vario.cpp>
	+<kalmanfilter4d.cpp>

lib_deps =
	m5stack/M5Unified@^0.2.26
	m5stack/M5GFX@^0.2.33
	h2zero/NimBLE-Arduino@^1.4.0

; ==============================================================================
; ESP32-C3 / ESP-WROOM-32 Variometer PlatformIO Configuration
; ==============================================================================

[env:esp32c3]
platform = espressif32
framework = arduino
board = upesy_wroom
board_build.flash_mode = qio
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
board_build.f_cpu = 80000000L
board_build.f_flash = 40000000L

build_flags =
	-DARDUINO_USB_MODE=1
	-DHW_REV_A

build_src_filter =
	+<*>
	-<m5_avionics_vario.cpp>

lib_deps =
	h2zero/NimBLE-Arduino@^1.4.0
	https://github.com/ayushsharma82/AsyncElegantOTA.git#v2.2.7
	AsyncTCP
	https://github.com/har-in-air/ESPAsyncWebServer.git

upload_speed = 115200
monitor_speed = 115200
build_type = debug
monitor_filters = esp32_exception_decoder

upload_port = COM5
monitor_port = COM5

; ==============================================================================
; NOVO AMBIENTE: Wemos ESP-WROOM-32 com OLED Integrado (SSD1306)
; Carga via pinos UART (RX/TX/GND/5V) ou OTA via Wi-Fi
; ==============================================================================
[env:esp32_wroom_oled]
platform = espressif32
framework = arduino
board = esp32dev
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
board_build.flash_mode = dio
board_build.f_flash = 40000000L

build_flags =
	-DESP32_WROOM_BMP280

build_src_filter =
	+<*>
	-<m5_avionics_vario.cpp>

lib_deps =
	h2zero/NimBLE-Arduino@^1.4.0
	https://github.com/ayushsharma82/AsyncElegantOTA.git#v2.2.7
	AsyncTCP
	https://github.com/har-in-air/ESPAsyncWebServer.git

; Velocidade para carga serial via adaptador USB-TTL nos pinos TX0/RX0
upload_speed = 115200
monitor_speed = 115200
build_type = debug
monitor_filters = esp32_exception_decoder

; Defina a porta COM do seu conversor USB-TTL aqui (ex: COM3, COM4, COM5)
upload_port = COM5
monitor_port = COM5

; ------------------------------------------------------------------------------
; ATUALIZAÇÃO POR OTA (OVER-THE-AIR) PARA AJUSTES FUTUROS:
; Depois de gravar a primeira vez pelos pinos, você NUNCA MAIS precisa de cabos!
; Para gravar direto pelo PlatformIO via Wi-Fi, descomente as duas linhas abaixo:
;upload_protocol = espota
;upload_port = 192.168.4.1   ; Ou use o hostname 'vario.local'
; ------------------------------------------------------------------------------
